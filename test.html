<section class="test-section">

    <p class="tag">🎯 FIND YOUR DIRECTION</p>

    <h1 class="page-title">Career Suggestion Test</h1>

    <p class="subtitle">
        Answer a few questions and explore a suitable career direction.
    </p>

    <div class="test-box">

        <input type="text" id="name" placeholder="Enter your name">

        <select id="interest">
            <option value="">What interests you?</option>
            <option value="technology">Technology & Computers</option>
            <option value="government">Government Services</option>
            <option value="medical">Medical & Healthcare</option>
            <option value="business">Business & Management</option>
            <option value="creative">Creative Work</option>
        </select>

        <select id="strength">
            <option value="">What is your strongest skill?</option>
            <option value="coding">Coding</option>
            <option value="communication">Communication</option>
            <option value="problem">Problem Solving</option>
            <option value="leadership">Leadership</option>
            <option value="creativity">Creativity</option>
        </select>

        <button onclick="getSuggestion()">Get My Career Suggestion ✨</button>

        <div id="result"></div>

    </div>

</section>
